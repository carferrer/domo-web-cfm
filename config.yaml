name: "Domo WEB"
version: "2026.08.18"
slug: "domo-web-cfm"
description: "Apache con soporte para MSSQL"
url: "https://github.com/carferrer/domo-web-cfm"
#image: "ghcr.io/carferrer/domo-web-cfm"
#image_tag: "latest"
arch:
  - aarch64
  - amd64
map:
  - "addon_config:rw"
  - "ssl:ro"
schema:
  url: "str?"
  puerto: port
  ssl_cert: "str?"
  ssl_key: "str?"
options:
  url: null
  puerto: 460
  ssl_cert: null
  ssl_key: null
ports:
  460/tcp: 460  # Indica el puerto interno fijo del contenedor
ports_description:
  460/tcp: puerto  # Vincula el puerto al campo "puerto" del schema superior

