name: "Domo WEB"
version: "2026.08.06"
slug: "domo-web-cfm"
description: "Apache con soporte para MSSQL"
url: "https://github.com/carferrer/domo-web-cfm"
#image: "ghcr.io/carferrer/domo-web-cfm"
#image_tag: "latest"
arch:
  - aarch64
  - amd64
map:
  - "addon_config:rw"
  - "ssl:ro"
# 1. Definir las variables que se verán en la interfaz 👇
schema:
  puerto: port
  ssl_cert: str
  ssl_key: str
# 2. Asignar valores por defecto 👇
options:
  puerto: 460
  ssl_cert: "fullchain.pem"
  ssl_key: "privkey.pem"
# 3. Vincular el puerto interno al puerto dinámico de la interfaz 👇
ports:
  460/tcp: puerto
