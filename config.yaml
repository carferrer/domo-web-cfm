name: "Domo WEB"
version: "2026.11.12"
# Migracion a imagen privada: requiere credenciales y revision manual.
breaking_versions:
  - "2026.11.12"
slug: "domo-web-cfm"
description: "Aplicacion domotica PHP con MSSQL, distribuida como imagen privada"
url: "https://github.com/carferrer/domo-web-cfm"
image: "ghcr.io/carferrer/domotica-php-cfm"
# La imagen base oficial de Home Assistant ya incluye s6-overlay.
# Evita que Supervisor añada un segundo init y provoque errores de PID 1.
init: false
arch:
  - aarch64
  - amd64
map:
  - "addon_config:rw" #dentro del addo en /config y es persistente y accesible con samba
  - "ssl:ro"
schema:
  url: "str?"
  ssl_cert: "str?"
  ssl_key: "str?"
  log_level: "list(trace|debug|info|notice|warning|error|fatal|critical)?"
options:
  url: null
  ssl_cert: null
  ssl_key: null
  log_level: "warning"
ports:
  460/tcp: 460        # Puerto interno 460 fijo. El usuario cambia el externo en la pestaña Red.
ports_description:
  460/tcp: "Puerto externo de acceso para Domo WEB"
